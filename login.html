<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuneralFriend — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #faf8f4;
    --sky-light: #deeaf5;
    --sky-mid: #b8d4ea;
    --sky-deep: #7aaecf;
    --text-dark: #2c2c2c;
    --text-mid: #5a5a5a;
    --text-light: #8a8a8a;
    --border: #e8e2d9;
    --red: #e07070;
  }
  body {
    font-family: 'Jost', sans-serif;
    background: linear-gradient(180deg, #c9dff2 0%, #deeaf5 30%, #faf8f4 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--text-dark);
    text-decoration: none;
    display: block;
    text-align: center;
    margin-bottom: 32px;
  }
  .logo span { color: var(--sky-deep); }
  .card {
    background: white;
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 8px 48px rgba(122,174,207,0.15);
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    color: var(--text-dark);
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .card-subtitle {
    font-size: 14px;
    font-weight: 300;
    color: var(--text-light);
    text-align: center;
    line-height: 1.7;
    margin-bottom: 32px;
  }
  .field { margin-bottom: 20px; }
  .field-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }
  .field-input {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    color: var(--text-dark);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .field-input:focus { border-color: var(--sky-deep); background: white; }
  .forgot-link {
    display: block;
    text-align: right;
    font-size: 12px;
    color: var(--text-light);
    text-decoration: none;
    margin-top: 6px;
    transition: color 0.2s;
  }
  .forgot-link:hover { color: var(--sky-deep); }
  .btn-primary {
    display: block;
    width: 100%;
    background: var(--sky-deep);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 50px;
    font-size: 14px;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(122,174,207,0.35);
    margin-top: 24px;
  }
  .btn-primary:hover { background: #5d9abf; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--border); color: var(--text-light); box-shadow: none; transform: none; cursor: not-allowed; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-size: 12px; color: var(--text-light); font-weight: 300; }
  .signup-link { text-align: center; font-size: 13px; font-weight: 300; color: var(--text-light); }
  .signup-link a { color: var(--sky-deep); text-decoration: none; font-weight: 400; }
  .signup-link a:hover { text-decoration: underline; }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-light);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--sky-deep); }
  .error-msg {
    background: #fef0f0;
    border: 1px solid #e0a0a0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 16px;
    display: none;
    line-height: 1.6;
  }
  @media (max-width: 480px) { .card { padding: 36px 24px; } }
</style>
</head>
<body>

<a href="index.html" class="logo">Funeral<span>Friend</span></a>

<div class="card">
  <h1 class="card-title">Welcome<br>back</h1>
  <p class="card-subtitle">Sign in to continue with your plan.</p>

  <div class="error-msg" id="error-msg"></div>

  <div class="field">
    <label class="field-label">Email address</label>
    <input type="email" class="field-input" placeholder="e.g. your@email.com" id="email">
  </div>

  <div class="field">
    <label class="field-label">Password</label>
    <input type="password" class="field-input" placeholder="Your password" id="password">
    <a href="#" class="forgot-link">Forgot your password?</a>
  </div>

  <button class="btn-primary" id="login-btn" onclick="signIn()">Sign in</button>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">don't have an account?</span>
    <div class="divider-line"></div>
  </div>

  <p class="signup-link"><a href="signup.html">Create one free</a></p>
</div>

<a href="index.html" class="back-link">← Back to FuneralFriend</a>

<script>
  const SUPABASE_URL = 'https://jjtjncedkqoxvoyalchc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqdGpuY2Vka3FveHZveWFsY2hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Njc3NDUsImV4cCI6MjA5NjE0Mzc0NX0.sdbKhWWvttWBFPcB-xNL0I-dCHGw-qdCe7aumPVtHNU';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function signIn() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');

    if (!email) { showError('Please enter your email address.'); return; }
    if (!password) { showError('Please enter your password.'); return; }

    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showError('Incorrect email or password. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    window.location.href = 'plan.html';
  }
</script>
</body>
</html>
